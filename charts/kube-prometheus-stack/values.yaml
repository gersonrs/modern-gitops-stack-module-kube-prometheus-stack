---
# Stack-wide Grafana dashboards (stack-overview, cluster, workloads). Every
# application dashboard is shipped by that application's own module.
grafanaDashboards:
  folder: Modern GitOps Stack

# -- Values passed to the kube-prometheus-stack chart
kube-prometheus-stack:

  # The Prometheus Operator CRDs are installed by crds_bootstrap before any
  # other module, so every application can enable its ServiceMonitor from the
  # very first apply. Keeping them enabled here as well would create a second
  # owner for the same objects.
  crds:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeEtcd:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  prometheusOperator:
    # manageCrds and tlsProxy were removed upstream: CRDs are owned by
    # crds_bootstrap (crds.enabled=false below) and the TLS proxy is gone.
    tls:
      enabled: false  # disable for now as I could not make it work
    admissionWebhooks:
      enabled: false  # disable for now as I could not make it work

  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

  grafana:
    sidecar:
      dashboards:
        # ALL is the upstream default in 93.x, kept explicit so the dashboards
        # shipped by every module are still discovered across namespaces.
        searchNamespace: ALL
      # grafana.plugins was removed upstream; grafana-piechart-panel is bundled
      # in Grafana 11+ and no longer needs to be installed.
