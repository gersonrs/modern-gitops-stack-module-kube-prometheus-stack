---
# Stack-wide Grafana dashboards (stack-overview, cluster, workloads). Every
# application dashboard is shipped by that application's own module.
grafanaDashboards:
  folder: Modern GitOps Stack

# -- Values passed to the kube-prometheus-stack chart
kube-prometheus-stack:

  # The Prometheus Operator CRDs are installed by crds_bootstrap before any
  # other module, so every application can enable its ServiceMonitor from the
  # very first apply. Keeping them enabled here as well would create a second
  # owner for the same objects.
  crds:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeEtcd:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  prometheusOperator:
    manageCrds: false
    tls:
      enabled: false  # disable for now as I could not make it work
    tlsProxy:
      enabled: false  # disable for now as I could not make it work
    admissionWebhooks:
      enabled: false  # disable for now as I could not make it work

  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

  grafana:
    sidecar:
      dashboards:
        searchNamespace: ALL
      datasources:
        searchNamespace: ALL
    plugins:
      - grafana-piechart-panel
