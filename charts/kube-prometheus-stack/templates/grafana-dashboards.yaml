{{- /*
Renders the stack-wide Grafana dashboards: stack-overview, cluster and
workloads.

These three are the only dashboards that do not belong to a single
application, so they live here. Every application dashboard is shipped by that
application's own module, keeping the same pattern across the stack.

The Grafana dashboard sidecar watches ConfigMaps labelled grafana_dashboard=1
in all namespaces, so they are provisioned without any Grafana API call or
restart.
*/ -}}
{{- $root := . -}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard-%s" $root.Release.Name $name | trunc 63 | trimSuffix "-" }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ $root.Values.grafanaDashboards.folder | quote }}
data:
  {{ $name }}.json: {{ $root.Files.Get $path | fromJson | toJson | quote }}
{{- end }}
