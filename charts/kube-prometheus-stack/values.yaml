---
# Grafana dashboards rendered by this chart.
#
# core: always rendered. One per application deployed by examples/*/main.tf,
# plus the stack-wide views. Argo CD is excluded because its own module ships
# its dashboard.
# optional: rendered only when listed, for applications from examples/*/apps.tf
# that may not be deployed.
grafanaDashboards:
  folder: Modern GitOps Stack
  core:
    - stack-overview
    - cluster
    - workloads
    - kube-prometheus-stack
    - cert-manager
    - metrics-server
    - metallb
    - istio
    - kiali
    - traefik
    - keycloak
    - postgresql
    - minio
    - loki
    - thanos
  optional: []

# -- Values passed to the kube-prometheus-stack chart
kube-prometheus-stack:

  kubeControllerManager:
    enabled: false

  kubeEtcd:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  prometheusOperator:
    manageCrds: false
    tls:
      enabled: false  # disable for now as I could not make it work
    tlsProxy:
      enabled: false  # disable for now as I could not make it work
    admissionWebhooks:
      enabled: false  # disable for now as I could not make it work

  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

  grafana:
    sidecar:
      dashboards:
        searchNamespace: ALL
      datasources:
        searchNamespace: ALL
    plugins:
      - grafana-piechart-panel
